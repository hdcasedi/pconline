{% load wagtailcore_tags %}
<div class="mb-6 grid grid-cols-1 md:grid-cols-10 gap-6">
    <div class="md:col-span-7">
        {% for block in value.left %}
            {% include_block block %}
        {% endfor %}
    </div>
    <div class="md:col-span-3">
        {% for block in value.right %}
            {% include_block block %}
        {% endfor %}
    </div>
</div>
