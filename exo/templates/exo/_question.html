<div class="mb-6 p-4 border border-gray-200 rounded-lg">
    <!-- En-tête de la question -->
    <div class="flex items-center justify-between mb-3">
        <h3 class="text-lg font-semibold text-gray-900">
            {{ question.numero }}
            <span class="text-sm font-normal text-gray-600 ml-2">
                ({{ question.points|floatformat:2 }} pt)
            </span>
        </h3>
        {% if question.fc %}
        <span class="inline-block bg-yellow-100 text-yellow-800 text-xs px-2 py-1 rounded">
            FC
        </span>
        {% endif %}
    </div>
    
    <!-- Contenu de la question -->
    <div class="prose max-w-none mb-4">
        {% for block in question.content %}
            {% include_block block %}
        {% endfor %}
    </div>
    
    <!-- Solution (repliable) -->
    {% if question.solution %}
    <div class="border-t pt-4">
        <details class="group">
            <summary class="cursor-pointer list-none">
                <div class="flex items-center justify-between">
                    <h4 class="text-md font-semibold text-gray-900">Solution</h4>
                    <svg class="w-5 h-5 text-gray-500 group-open:rotate-180 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                    </svg>
                </div>
            </summary>
            <div class="mt-4 prose max-w-none">
                {% include "exo/_solution.html" with solution=question.solution %}
            </div>
        </details>
    </div>
    {% endif %}
</div>
