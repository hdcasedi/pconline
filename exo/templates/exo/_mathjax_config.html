<script>
// Configuration MathJax simplifiée pour les exercices
// Éviter les conflits avec la configuration globale

// Attendre que la page soit complètement chargée
window.addEventListener('load', function() {
  // Attendre que MathJax soit initialisé
  setTimeout(function() {
    try {
      if (window.MathJax && window.MathJax.typesetPromise) {
        // Re-rendre seulement le contenu de l'exercice
        const exerciseContent = document.querySelector('.bg-white.rounded-lg.shadow-md.p-6');
        if (exerciseContent) {
          MathJax.typesetPromise([exerciseContent]).then(function() {
            console.log('MathJax rendu avec succès pour l\'exercice');
          }).catch(function(err) {
            console.log('Erreur MathJax (non critique):', err);
          });
        }
      }
    } catch (error) {
      console.log('Erreur lors du rendu MathJax (non critique):', error);
    }
  }, 1000);
});
</script>
