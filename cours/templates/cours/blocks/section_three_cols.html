{% load wagtailcore_tags %}

<div class="relative grid grid-cols-1 lg:grid-cols-12 gap-6 mb-6">
  {% if value.video_url %}
    <button class="absolute top-2 right-2 text-blue-700" onclick="window.dispatchEvent(new CustomEvent('open-video', { detail: '{{ value.video_url }}' }))" title="Voir la vidéo">📺</button>
  {% endif %}
  <div class="lg:col-span-4">
    {% for b in value.col1 %}{% include_block b %}{% endfor %}
  </div>
  <div class="lg:col-span-4">
    {% for b in value.col2 %}{% include_block b %}{% endfor %}
  </div>
  <div class="lg:col-span-4">
    {% for b in value.col3 %}{% include_block b %}{% endfor %}
  </div>
</div>
